name: 功能建议
description: 提出一个新功能或改进（拉片流程、播放、逐帧、UI 等）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给实现方案
      placeholder: "看 MAD 时想对比两个转场，但现在的 A-B 只能存一组……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      placeholder: "希望能保存多组 A-B，用快捷键切换"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 本地播放/逐帧/seek
        - A-B 循环/变速/波形
        - 标记/备注/截图
        - B 站在线/清晰度/缓存
        - 拖动预览（清晰度/缓存配置）
        - 界面/设置/快捷键
        - 构建/打包/文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 你目前怎么绕过（可选）
    validations:
      required: false
